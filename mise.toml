[tools]
gh = "latest"
pre-commit = "latest"
rust = "1.91.0"
worktrunk = "latest"

# Production Swift core ------------------------------------------------------

[tasks.build]
description = "Build the production Swift core"
run = "./scripts/swift-package.sh build"

[tasks.test]
description = "Run deterministic Swift core tests"
run = "./scripts/swift-package.sh test"

[tasks.lint]
description = "Lint Swift, scripts, plists, patches, and repository formatting"
depends = ["swift-format", "project-check"]

[tasks.check]
description = "Run the production Swift core checks"
depends = ["lint", "test"]

[tasks.swift-format]
description = "Lint Swift package formatting"
run = "./scripts/swift-package.sh format"

[tasks.swift-build]
description = "Compatibility alias for the Swift core build"
depends = ["build"]

[tasks.swift-test]
description = "Compatibility alias for deterministic Swift core tests"
depends = ["test"]

[tasks.swift-check]
description = "Compatibility alias for the production Swift core checks"
depends = ["check"]

[tasks.project-check]
description = "Validate scripts, plists, upstream patches, and diff formatting"
run = "./scripts/check-project.sh"

[tasks.swift-plist-check]
description = "Compatibility alias for repository structure checks"
depends = ["project-check"]

[tasks.swift-app]
description = "Build the unsigned structural MicFlurry service host app"
run = "./scripts/build-swift-app.sh ${MICFLURRY_VERSION:-0.3.0} ${MICFLURRY_BUILD_NUMBER:-1}"

[tasks.swift-app-check]
description = "Validate the assembled MicFlurry service host app"
run = "./scripts/check-swift-app.sh"

[tasks.swift-private-app]
description = "Build and validate the ad-hoc private service app"
run = "./scripts/build-private-swift-app.sh ${MICFLURRY_VERSION:-0.3.0} ${MICFLURRY_BUILD_NUMBER:-1}"

[tasks.swift-private-install]
description = "Build, stage, validate, and install the private service app"
depends = ["swift-private-app"]
run = "./scripts/install-built-private-services.sh"

[tasks.swift-private-reload]
description = "Reload the already staged private service app after TCC changes"
run = "./scripts/reload-built-private-services.sh"

[tasks.swift-private-test]
description = "Test private identifier and CDHash mutual authentication"
run = "./scripts/swift-package.sh private-test"

[tasks.swift-private-dist]
description = "Build a private tester archive and checksum"
run = "./scripts/build-private-distribution.sh ${MICFLURRY_VERSION:-0.3.0}"

[tasks.swift-socket-test]
description = "Run the host-only Unix control socket integration test"
run = "./scripts/swift-package.sh socket-test"

# Rust demo UI ---------------------------------------------------------------

[tasks.demo-ui-fmt]
run = "cargo fmt --all -- --check"

[tasks.demo-ui-test]
run = "cargo test --workspace"

[tasks.demo-ui-clippy]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.demo-ui-check]
description = "Check the optional Rust TUI demo client"
depends = ["demo-ui-fmt", "demo-ui-test", "demo-ui-clippy"]

[tasks.ctl]
description = "Send JSON-RPC commands to the running micflurryd control socket"
run = "./scripts/micflurryctl.py"

[tasks.keymap-input-check]
description = "Wait 15 seconds for remote input, then print compact daemon status"
run = "./scripts/check-keymap-input-after-delay.sh"

[tasks.keymap-install]
description = "Atomically install a per-model TOML keymap in ~/.config/micflurry"
run = "./scripts/install-keymap-config.sh"

[tasks.friend-dist]
description = "Build the all-in-one friend distribution zip (driver plus services)"
run = "./scripts/build-friend-distribution.sh ${MICFLURRY_VERSION:-0.3.0}"

[tasks.micflurry]
description = "Run the Rust TUI as a client of the Swift daemon"
env = { MICFLURRY_LOG = "/tmp/micflurry-tui.log", RUST_LOG = "micflurry=info" }
run = "cargo run -p micflurry-tui --"

[tasks.verify-asr]
description = "Verify installed CoreAudio endpoints using sandbox-writable compiler caches"
env = {
  CLANG_MODULE_CACHE_PATH = "/tmp/micflurry-clang-module-cache",
  SWIFT_MODULECACHE_PATH = "/tmp/micflurry-swift-module-cache",
}
run = "./scripts/verify-asr-format.swift"
