[workspace]
members = [
    "crates/micflurry-control",
    "crates/micflurry-core",
    "crates/micflurry-hid-probe",
    "crates/micflurry-tui",
]
exclude = [".build/btleplug"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/phateffect/mic-flurry"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
btleplug = { path = ".build/btleplug" }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
coreaudio-rs = "0.14.2"
core-graphics = "0.25.0"
core-foundation = "0.10.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.31"
hound = "3.5.1"
ratatui = "0.30.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
